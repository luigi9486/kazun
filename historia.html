<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Historia Parafii - Parafia Kazuń Bielany</title>
    
    <!-- Podpięcie głównego pliku stylów -->
    <link rel="stylesheet" href="style.css">
    
    <!-- Google Fonts dla stylowania tekstu historycznego -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,600;0,700;1,400&family=Lora:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">

    <style>
        /* Nadpisanie układu dwukolumnowego z style.css dla pojedynczej strony z artykułem */
        main.history-container {
            display: block;
            max-width: 900px;
            margin: 20px auto 40px;
            padding: 0 15px;
            font-family: 'Lora', Georgia, serif;
            line-height: 1.8;
        }

        .history-header {
            text-align: center;
            padding: 20px 15px;
            margin-bottom: 25px;
        }

        .history-header h1 {
            font-family: 'Cormorant Garamond', serif;
            font-size: 2.5rem;
            color: var(--accent-gold, #d69e2e);
            margin-bottom: 8px;
        }

        .subtitle {
            font-style: italic;
            opacity: 0.85;
            font-size: 1.05rem;
        }

        .history-card {
            background: var(--card-bg, #ffffff);
            padding: 35px;
            border-radius: 14px;
            box-shadow: var(--shadow, 0 4px 12px rgba(0,0,0,0.05));
            border-left: 4px solid var(--accent-gold, #d69e2e);
            margin-bottom: 30px;
        }

        .history-card h2 {
            font-family: 'Cormorant Garamond', serif;
            font-size: 1.8rem;
            color: var(--accent-gold, #d69e2e);
            margin-top: 0;
            margin-bottom: 15px;
            border-bottom: 1px dashed rgba(214, 158, 46, 0.3);
            padding-bottom: 8px;
        }

        .history-card p {
            margin-bottom: 1.2rem;
            text-align: left;
            font-size: 1.05rem;
        }

        .history-card p:last-child {
            margin-bottom: 0;
        }

        /* Sekcja Obecnych Duszpasterzy */
        .clergy-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 20px;
            margin-top: 15px;
        }

        .clergy-box {
            background: rgba(214, 158, 46, 0.08);
            padding: 20px;
            border-radius: 10px;
            border-left: 3px solid var(--accent-gold, #d69e2e);
        }

        .clergy-box h3 {
            font-family: 'Cormorant Garamond', serif;
            color: var(--accent-gold, #d69e2e);
            margin-top: 0;
            margin-bottom: 6px;
            font-size: 1.4rem;
        }

        .clergy-name {
            font-weight: 700;
            font-size: 1.1rem;
            margin-bottom: 6px !important;
        }

        .clergy-details {
            font-size: 0.95rem;
            line-height: 1.5;
            margin-bottom: 0 !important;
            opacity: 0.9;
        }
