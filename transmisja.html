<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">

<!-- Google tag (gtag.js) -->

  window.dataLayer = window.dataLayer || [];

  gtag('config', 'G-8KFWFQ9SMJ');

<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Transmisja na żywo - Parafia Kazuń Bielany</title>
<link rel="icon" type="image/png" href="favicon.png">
<link rel="stylesheet" href="style.css">

<style>
main.page-container {
    display: block;
    max-width: 900px;
    margin: 2rem auto 3rem;
    padding: 0 1rem;
}

.stream-box {
    background: var(--card-bg, #ffffff);
    border: 1px solid rgba(214, 158, 46, 0.3);
    border-radius: 14px;
    padding: 1.5rem;
    box-shadow: var(--shadow, 0 2px 8px rgba(0,0,0,0.05));
    text-align: center;
}

.stream-box h1 {
    font-family: 'Georgia', serif;
    color: var(--accent-gold, #c5a059);
    font-size: 1.5rem;
    margin: 0 0 1.2rem 0;
}

.video-wrapper {
    position: relative;
    padding-bottom: 56.25%;
    height: 0;
    overflow: hidden;
    border-radius: 10px;
    background: #000;
}

.video-wrapper iframe {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    border: 0;
}

.stream-note {
    margin-top: 1rem;
    font-size: 0.9rem;
    opacity: 0.85;
    line-height: 1.5;
}

.stream-note a {
    color: var(--accent-gold, #c5a059);
    font-weight: bold;
    text-decoration: underline;
}

@media (max-width: 600px) {
    .stream-box {
        padding: 1rem;
    }
    .stream-box h1 {
        font-size: 1.25rem;
    }
}
</style>
</head>
<body>

<header id="main-header"></header>

<main class="page-container">
    <section class="stream-box">
        <h1>📺 Transmisja na żywo</h1>

        <div class="video-wrapper">
            <iframe 
                src="https://www.youtube.com/embed/live_stream?channel=UCl-gnQzXj_2EBS38i8b2vxQ" 
                allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" 
                allowfullscreen>
            </iframe>
        </div>

        <p class="stream-note">
            Jeśli transmisja nie uruchamia się automatycznie, kliknij przycisk odtwarzania na środku ekranu lub 
            <a href="https://www.youtube.com/channel/UCl-gnQzXj_2EBS38i8b2vxQ/live" target="_blank">otwórz transmisję bezpośrednio na YouTube</a>.
        </p>
    </section>
</main>

<footer id="main-footer"></footer>

<script src="nav.js"></script>
</body>
</html>
