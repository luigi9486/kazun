<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Intencje Mszalne - Parafia Kazuń Bielany</title>
    
    <!-- Główny plik stylów -->
    <link rel="stylesheet" href="style.css">

    <style>
        /* Nadpisanie dwukolumnowego układu z main w style.css */
        main.intentions-container {
            display: block; /* Wyłącza dwukolumnowy grid z style.css */
            max-width: 950px;
            margin: 20px auto 40px;
            padding: 0 15px;
            width: 100%;
            box-sizing: border-box;
        }

        /* Stylizacja rozwijanych kart w archiwum intencji */
        details {
            background: var(--card-bg, #ffffff);
            border-radius: 12px;
            box-shadow: var(--shadow, 0 4px 12px rgba(0,0,0,0.05));
            border: 1px solid rgba(214, 158, 46, 0.2);
            margin-bottom: 1.2rem;
            overflow: hidden;
            padding: 1rem 1.2rem;
            transition: border-color 0.3s;
        }

        details[open] {
            border-color: var(--accent-gold, #d69e2e);
        }

        summary {
            font-weight: 700;
            font-size: 1.1rem;
            color: var(--text-color);
            cursor: pointer;
            list-style: none;
            display: flex;
            justify-content: space-between;
            align-items: center;
            user-select: none;
        }

        summary::-webkit-details-marker {
            display: none;
        }

        summary::after {
            content: '▼';
            font-size: 0.8rem;
            color: var(--accent-gold, #d69e2e);
            transition: transform 0.3s ease;
            margin-left: 0.5rem;
        }

        details[open] summary::after {
            transform: rotate(180deg);
        }

        .details-content {
            padding-top: 1rem;
            border-top: 1px dashed rgba(214, 158, 46, 0.25);
            margin-top: 0.8rem;
        }

        @media (max-width: 650px) {
            main.intentions-container {
                padding: 0 10px;
            }
            details {
                padding: 0.8rem 1rem;
            }
        }
    </style>
</head>
<body>

    <!-- Dynamiczny nagłówek ładowany przez nav.js -->
    <header id="main-header"></header>

    <main class="intentions-container">
        
        <h1 style="text-align: center; font-family: 'Georgia', serif; margin-bottom: 2rem; color: var(--accent-gold);">
            Intencje Mszalne
        </h1>

        <!-- Kontener ładowany dynamicznie z Google Sheets przez intencje.js -->
        <div id="intencje-container">
            <p style="text-align: center; padding: 2rem;">Ładowanie intencji mszalnych...</p>
        </div>

    </main>

    <!-- Dynamiczna stopka ładowana przez nav.js -->
    <footer id="main-footer"></footer>

    <!-- Skrypty nawigacji, stopki oraz automatycznego pobierania intencji -->
    <script src="nav.js"></script>
    <script src="intencje.js"></script>
</body>
</html>
