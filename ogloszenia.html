<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ogłoszenia Duszpasterskie - Parafia Kazuń Bielany</title>
    
    <link rel="stylesheet" href="style.css">

    <style>
        /* Wymuszenie czystego, pełnego układu podstrony */
        main.page-container {
            display: block !important;
            max-width: 900px;
            margin: 2rem auto;
            padding: 0 1rem;
            width: 100%;
            box-sizing: border-box;
        }

        /* Nagłówek podstrony */
        .page-title {
            text-align: center;
            margin-bottom: 2rem;
        }

        .page-title h1 {
            font-family: 'Georgia', serif;
            color: var(--accent-gold);
            font-size: 2.2rem;
            margin-bottom: 0.5rem;
        }

        .page-title p {
            font-size: 1.05rem;
            opacity: 0.85;
        }

        /* Sekcja Ogłoszeń */
        .announcements-section {
            margin-top: 1rem;
        }

        /* Stylowanie rozwijanych kart w archiwum */
        details {
            background: var(--card-bg);
            border-radius: 12px;
            margin-bottom: 1.2rem;
            box-shadow: var(--shadow);
            border: 1px solid rgba(214, 158, 46, 0.2);
            overflow: hidden;
            transition: border-color 0.3s;
            padding: 1rem 1.2rem;
        }

        details[open] {
            border-color: var(--accent-gold);
        }

        summary {
            font-weight: 700;
            font-size: 1.1rem;
            color: var(--text-color);
            cursor: pointer;
            list-style: none;
            display: flex;
            justify-content: space-between;
            align-items: center;
            user-select: none;
        }

        summary::-webkit-details-marker {
            display: none;
        }

        summary::after {
            content: '▼';
            font-size: 0.8rem;
            color: var(--accent-gold);
            transition: transform 0.3s ease;
            margin-left: 0.5rem;
        }

        details[open] summary::after {
            transform: rotate(180deg);
        }

        .details-content {
            padding-top: 1rem;
            border-top: 1px dashed rgba(214, 158, 46, 0.25);
            margin-top: 0.8rem;
        }

        @media (max-width: 600px) {
            .page-title h1 {
                font-size: 1.8rem;
            }
            details {
                padding: 0.8rem 1rem;
            }
        }
    </style>
</head>
<body>

    <!-- Dynamiczny nagłówek ładowany przez nav.js -->
    <header id="main-header"></header>

    <main class="page-container">
        
        <!-- Tytuł podstrony -->
        <div class="page-title">
            <h1>OGŁOSZENIA DUSZPASTERSKIE</h1>
            <p>Słowo duszpasterzy i aktualne wydarzenia z życia parafii</p>
        </div>

        <!-- Kontener ładowany dynamicznie z Google Sheets przez ogloszenia.js -->
        <section class="announcements-section" id="ogloszenia-container">
            <p style="text-align: center; padding: 2rem;">Ładowanie ogłoszeń...</p>
        </section>

    </main>

    <!-- Dynamiczna stopka ładowana przez nav.js -->
    <footer id="main-footer"></footer>

    <!-- Skrypty nawigacji, stopki oraz automatycznego pobierania ogłoszeń -->
    <script src="nav.js"></script>
    <script src="ogloszenia.js"></script>
</body>
</html>
